name: Go

on:
  push:
    branches: [ "Aula_1", "Aula_2", "Projeto_base" ]
  pull_request:
    branches: [ "Aula_1", "Aula_2", "Projeto_base" ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HOST: localhost
      PORT: 5432
      USER: root
      PASSWORD: root
      DBNAME: root
    strategy:
      matrix:
        go_version: ['1.18', '1.20', '1.22']
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go_version }}
 
    - name: Build-DB
      run: docker compose build
 
    - name: Create-DB
      run: docker compose up -d

    - name: Test
      run: go test -v ./...
 
  build:
    needs: test
    runs-on: ubuntu-latest 
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: '1.22'

    - name: Build
      run: go build -v main.go
